<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INLIGHT</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #252525;
      color: #f2f2f2;
      font-family:
        "BPG Nino Mtavruli Regular",
        "BPG Nino Mtavruli",
        Arial,
        sans-serif;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #111;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    .hero-dark,
    .hero-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hero-dark {
      z-index: 2;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, .42) 0%,
        rgba(0, 0, 0, .18) 40%,
        rgba(0, 0, 0, .58) 100%
      );
    }

    .hero-vignette {
      z-index: 3;
      background: radial-gradient(
        ellipse at center,
        transparent 25%,
        rgba(0, 0, 0, .18) 100%
      );
    }

    .back-button {
      position: absolute;
      top: 42px;
      left: 38px;
      z-index: 20;

      display: flex;
      align-items: center;
      gap: 10px;

      height: 36px;
      padding: 0 17px 0 5px;

      border-radius: 22px;
      background: rgba(116, 77, 45, .82);

      color: #f4f4f4;
      text-decoration: none;
      font-size: 12px;
      line-height: 1;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      transition: .2s ease;
    }

    .back-button:hover {
      background: rgba(130, 84, 47, .95);
      transform: translateY(-1px);
    }

    .back-icon {
      width: 27px;
      height: 27px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #f2f2f2;

      color: #e77518;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    .services-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;

      width: 100%;
      padding: 45px 40px 58px;

      background: linear-gradient(
        180deg,
        rgba(37, 37, 37, 0) 0%,
        rgba(37, 37, 37, .32) 18%,
        rgba(37, 37, 37, .78) 55%,
        rgba(37, 37, 37, .92) 100%
      );
    }

    .services-content {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;

      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 90px;
    }

    .services-title {
      flex-shrink: 0;
      margin-top: 14px;

      color: #f2f2f2;
      text-align: left;
      white-space: nowrap;

      font-size: clamp(22px, 2.25vw, 30px);
      line-height: 1.4;
      font-weight: 400;
      letter-spacing: .7px;

      text-shadow: 0 2px 8px rgba(0, 0, 0, .35);
    }

    .services-grid {
      flex-shrink: 0;

      display: flex;
      align-items: flex-start;
      gap: 70px;
    }

    .service {
      width: 56px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .service-icon-wrapper {
      position: relative;
      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }

    .service-icon {
      width: 56px;
      height: 56px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #e77518;

      box-shadow: 0 2px 8px rgba(0, 0, 0, .22);
      overflow: hidden;
    }

    .service-icon svg {
      width: 20px;
      height: 20px;

      display: block;

      fill: none;
      stroke: #fff;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .service-number {
      position: absolute;
      right: -7px;
      bottom: -1px;

      width: 22px;
      height: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      border: 2px solid rgba(37, 37, 37, .95);

      background: #e77518;
      color: #fff;

      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;

      z-index: 2;
    }

    .service-number::after {
      content: "";
      position: absolute;
      inset: 1px;

      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 50%;
    }

    .connector {
      width: 100px;
      height: 1px;

      margin-top: 27px;

      flex-shrink: 0;

      background: #a95c1d;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
    }

    .service-name {
      width: 160px;
      margin-top: 25px;

      color: rgba(242, 242, 242, .82);

      font-size: clamp(12px, 1.15vw, 16px);
      line-height: 1.45;
      font-weight: 400;
      text-align: center;

      text-shadow: 0 2px 6px rgba(0, 0, 0, .45);
    }

    @media (min-width: 601px) and (max-width: 1100px) {
      .back-button {
        top: 28px;
        left: 28px;
      }

      .services-overlay {
        padding: 35px 30px;
      }

      .services-content {
        max-width: 100%;
        gap: 45px;
      }

      .services-title {
        font-size: 22px;
      }

      .services-grid {
        gap: 40px;
      }

      .service,
      .service-icon-wrapper,
      .service-icon {
        width: 52px;
      }

      .service-icon-wrapper,
      .service-icon {
        height: 52px;
      }

      .service-icon svg {
        width: 19px;
        height: 19px;
      }

      .connector {
        width: 65px;
        margin-top: 25px;
      }

      .service-name {
        width: 140px;
        font-size: 13px;
      }
    }

    @media (max-width: 600px) {
      .back-button {
        top: 18px;
        left: 16px;

        height: 34px;
        padding-right: 13px;
        font-size: 10px;
      }

      .back-icon {
        width: 26px;
        height: 26px;
        font-size: 17px;
      }

      .services-overlay {
        padding: 25px 18px;

        background: linear-gradient(
          180deg,
          rgba(37, 37, 37, 0) 0%,
          rgba(37, 37, 37, .40) 15%,
          rgba(37, 37, 37, .90) 55%,
          rgba(37, 37, 37, .96) 100%
        );
      }

      .services-content {
        width: 100%;
        max-width: none;

        flex-direction: column;
        align-items: center;
        gap: 22px;
      }

      .services-title {
        width: 100%;
        margin: 0;

        text-align: center;
        white-space: normal;

        font-size: 18px;
        line-height: 1.5;
      }

      .services-grid {
        width: 100%;

        justify-content: center;
        gap: 35px;
      }

      .service,
      .service-icon-wrapper,
      .service-icon {
        width: 52px;
      }

      .service-icon-wrapper,
      .service-icon {
        height: 52px;
      }

      .service-icon svg {
        width: 19px;
        height: 19px;
      }

      .connector {
        width: 55px;
        margin-top: 25px;
      }

      .service-name {
        width: 135px;
        margin-top: 18px;

        font-size: 13px;
        line-height: 1.4;
      }
    }

    @media (max-width: 380px) {
      .services-overlay {
        padding: 20px 14px;
      }

      .services-content {
        gap: 18px;
      }

      .services-title {
        font-size: 16px;
      }

      .services-grid {
        gap: 25px;
      }

      .service,
      .service-icon-wrapper,
      .service-icon {
        width: 48px;
      }

      .service-icon-wrapper,
      .service-icon {
        height: 48px;
      }

      .service-icon svg {
        width: 17px;
        height: 17px;
      }

      .connector {
        width: 40px;
        margin-top: 23px;
      }

      .service-name {
        width: 120px;
        margin-top: 15px;
        font-size: 12px;
      }
    }

    @media (max-height: 700px) and (min-width: 601px) {
      .services-overlay {
        padding-top: 20px;
        padding-bottom: 25px;
      }

      .services-content {
        gap: 70px;
      }

      .services-title {
        font-size: 21px;
      }

      .services-grid {
        gap: 55px;
      }

      .service-name {
        font-size: 12px;
      }
    }

    @media (max-height: 700px) and (max-width: 600px) {
      .services-overlay {
        padding-top: 15px;
        padding-bottom: 15px;
      }

      .services-content {
        gap: 12px;
      }

      .services-title {
        font-size: 15px;
      }

      .services-grid {
        gap: 25px;
      }

      .service-name {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <img
      class="hero-image"
      src="./ინტერიერი.jpg"
      alt="ინტერიერის დიზაინი"
    >

    <div class="hero-dark"></div>
    <div class="hero-vignette"></div>

    <!-- BACK BUTTON -->
    <a href="./index.html" class="back-button">
      <span class="back-icon">‹‹</span>
      <span>დაბრუნება</span>
    </a>

    <div class="services-overlay">

      <div class="services-content">

        <h1 class="services-title">
          ინტერიერის დიზაინის სერვისი მოიცავს:
        </h1>

        <div class="services-grid">

          <article class="service">

            <div class="service-icon-wrapper">

              <div class="service-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3.5 20 8v8l-8 4.5L4 16V8l8-4.5Z"/>
                  <path d="M12 3.5V12"/>
                  <path d="M4 8l8 4 8-4"/>
                  <path d="M12 12v8.5"/>
                </svg>
              </div>

              <span class="service-number">1</span>

            </div>

            <div class="service-name">
              ინტერიერის 3D<br>
              ვიზუალიზაცია
            </div>

          </article>

          <div class="connector"></div>

          <article class="service">

            <div class="service-icon-wrapper">

              <div class="service-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="3.5" width="14" height="17" rx="1.5"/>
                  <path d="M8.5 8h7"/>
                  <path d="M8.5 11.5h7"/>
                  <path d="M8.5 15h4"/>
                  <path d="m15.5 15.5 1 1 2-2"/>
                </svg>
              </div>

              <span class="service-number">2</span>

            </div>

            <div class="service-name">
              სრული<br>
              სპეციფიკაცია
            </div>

          </article>

        </div>

      </div>

    </div>

  </section>

</body>
</html>
