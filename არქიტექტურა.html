<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INLIGHT</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #252525;
      color: #f2f2f2;
      font-family:
        "BPG Nino Mtavruli Regular",
        "BPG Nino Mtavruli",
        Arial,
        sans-serif;
    }

    /* HERO */

    .hero {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #111;
    }

    /* VIDEO */

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
    }

    /* OVERLAYS */

    .hero-dark,
    .hero-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hero-dark {
      z-index: 2;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, .42) 0%,
        rgba(0, 0, 0, .18) 40%,
        rgba(0, 0, 0, .58) 100%
      );
    }

    .hero-vignette {
      z-index: 3;
      background: radial-gradient(
        ellipse at center,
        transparent 25%,
        rgba(0, 0, 0, .18) 100%
      );
    }

    /* BACK BUTTON */

    .back-button {
      position: absolute;
      top: 42px;
      left: 38px;
      z-index: 20;

      display: flex;
      align-items: center;
      gap: 10px;

      height: 36px;
      padding: 0 17px 0 5px;

      border-radius: 22px;
      background: rgba(116, 77, 45, .82);

      color: #f4f4f4;
      text-decoration: none;
      font-size: 12px;
      line-height: 1;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      transition: .2s ease;
    }

    .back-button:hover {
      background: rgba(130, 84, 47, .95);
      transform: translateY(-1px);
    }

    .back-icon {
      width: 27px;
      height: 27px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #f2f2f2;

      color: #e77518;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    /* SERVICES OVERLAY */

    .services-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;

      width: 100%;
      padding: 45px 40px 58px;

      background: linear-gradient(
        180deg,
        rgba(37, 37, 37, 0) 0%,
        rgba(37, 37, 37, .32) 18%,
        rgba(37, 37, 37, .78) 55%,
        rgba(37, 37, 37, .92) 100%
      );
    }

    /* TITLE */

    .services-title {
      margin: 0 auto;

      color: #f2f2f2;
      text-align: center;

      font-size: clamp(22px, 2.25vw, 30px);
      line-height: 1.4;
      font-weight: 400;
      letter-spacing: .7px;

      text-shadow: 0 2px 8px rgba(0, 0, 0, .35);
    }

    /* SERVICES GRID */

    .services-grid {
      width: 100%;
      max-width: 1200px;
      margin: 52px auto 0;

      display: grid;
      grid-template-columns:
        56px
        minmax(30px, 1fr)
        56px
        minmax(30px, 1fr)
        56px
        minmax(30px, 1fr)
        56px
        minmax(30px, 1fr)
        56px;

      align-items: start;
    }

    /* SERVICE */

    .service {
      width: 56px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    /* ICON */

    .service-icon-wrapper {
      position: relative;
      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }

    .service-icon {
      width: 56px;
      height: 56px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #e77518;

      box-shadow: 0 2px 8px rgba(0, 0, 0, .22);
      overflow: hidden;
    }

    .service-icon svg {
      width: 19px;
      height: 19px;
      display: block;
      stroke: #fff;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* NUMBER */

    .service-number {
      position: absolute;
      right: -7px;
      bottom: -1px;

      width: 22px;
      height: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      border: 2px solid rgba(37, 37, 37, .95);

      background: #e77518;
      color: #fff;

      font-family: Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;

      z-index: 2;
    }

    .service-number::after {
      content: "";
      position: absolute;
      inset: 1px;

      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 50%;
    }

    /* CONNECTOR */

    .connector {
      width: calc(100% - 48px);
      height: 1px;

      margin-left: 24px;
      margin-top: 27px;

      align-self: start;

      background: #a95c1d;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
    }

    /* SERVICE NAME */

    .service-name {
      width: 180px;
      margin-top: 25px;

      color: rgba(242, 242, 242, .82);

      font-size: clamp(12px, 1.15vw, 16px);
      line-height: 1.45;
      font-weight: 400;

      text-align: center;

      text-shadow: 0 2px 6px rgba(0, 0, 0, .45);
    }

    .service:nth-child(3) .service-name {
      width: 220px;
    }

    /* TABLET */

    @media (min-width: 601px) and (max-width: 1100px) {
      .back-button {
        top: 28px;
        left: 28px;
      }

      .services-overlay {
        padding: 35px 30px;
      }

      .services-title {
        width: 700px;
        max-width: 100%;
        text-align: left;
        font-size: 24px;
      }

      .services-grid {
        max-width: 700px;
        margin-top: 32px;

        grid-template-columns: 1fr 1fr;
        column-gap: 70px;
        row-gap: 28px;
      }

      .connector {
        display: none;
      }

      .service,
      .service:nth-of-type(5) {
        width: 100%;

        flex-direction: row;
        align-items: center;
        justify-content: flex-start;

        gap: 18px;
        text-align: left;
      }

      .service:nth-of-type(5) {
        grid-column: 1;
        grid-row: 3;
      }

      .service-icon-wrapper,
      .service-icon {
        width: 52px;
        height: 52px;
      }

      .service-icon svg {
        width: 17px;
        height: 17px;
      }

      .service-name,
      .service:nth-child(3) .service-name {
        width: auto;
        margin-top: 0;

        font-size: 13px;
        text-align: left;
      }
    }

    /* MOBILE */

    @media (max-width: 600px) {
      .back-button {
        top: 18px;
        left: 16px;

        height: 34px;
        padding-right: 13px;
        font-size: 10px;
      }

      .back-icon {
        width: 26px;
        height: 26px;
        font-size: 17px;
      }

      .services-overlay {
        padding: 25px 18px;

        background: linear-gradient(
          180deg,
          rgba(37, 37, 37, 0) 0%,
          rgba(37, 37, 37, .40) 15%,
          rgba(37, 37, 37, .90) 55%,
          rgba(37, 37, 37, .96) 100%
        );
      }

      .services-title {
        width: 100%;
        max-width: 340px;

        margin: 0;

        text-align: left;
        font-size: 20px;
        line-height: 1.5;
      }

      .services-grid {
        margin-top: 25px;

        display: flex;
        flex-direction: column;
        align-items: stretch;

        gap: 18px;
      }

      .connector {
        display: none;
      }

      .service,
      .service:nth-of-type(5) {
        width: 100%;

        flex-direction: row;
        align-items: center;
        justify-content: flex-start;

        gap: 18px;
        text-align: left;
      }

      .service-icon-wrapper,
      .service-icon {
        width: 52px;
        height: 52px;
      }

      .service-icon svg {
        width: 17px;
        height: 17px;
      }

      .service-name,
      .service:nth-child(3) .service-name {
        width: auto;
        margin-top: 0;

        font-size: 13px;
        line-height: 1.4;
        text-align: left;
      }
    }

    /* SMALL MOBILE */

    @media (max-width: 380px) {
      .services-overlay {
        padding: 20px 14px;
      }

      .services-title {
        font-size: 18px;
      }

      .services-grid {
        margin-top: 18px;
        gap: 13px;
      }

      .service,
      .service:nth-of-type(5) {
        gap: 14px;
      }

      .service-icon-wrapper,
      .service-icon {
        width: 48px;
        height: 48px;
      }

      .service-icon svg {
        width: 16px;
        height: 16px;
      }

      .service-name,
      .service:nth-child(3) .service-name {
        font-size: 12px;
      }
    }

    /* SHORT DESKTOP / TABLET */

    @media (max-height: 700px) and (min-width: 601px) {
      .services-overlay {
        padding-top: 20px;
        padding-bottom: 25px;
      }

      .services-grid {
        margin-top: 22px;
        row-gap: 20px;
      }

      .service-name {
        font-size: 12px;
      }
    }

    /* SHORT MOBILE */

    @media (max-height: 700px) and (max-width: 600px) {
      .services-overlay {
        padding-top: 15px;
        padding-bottom: 15px;
      }

      .services-title {
        font-size: 17px;
      }

      .services-grid {
        margin-top: 12px;
        gap: 9px;
      }

      .service-name,
      .service:nth-child(3) .service-name {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <!-- ARCHITECTURE BACKGROUND VIDEO -->
    <video
      class="hero-video"
      src="./არქიტექტურის რენდერი.mov"

      muted
      loop

            ურბანული<br>
            დაგეგმარება
          </div>
        </article>

        <div class="connector"></div>

        <!-- 2. ლანდშაფტის დიზაინის მოდელირება -->

        <article class="service">
          <div class="service-icon-wrapper">
            <div class="service-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">

                <path d="M5 21c1-4 3-7 6-10"></path>

            <span class="service-number">2</span>

          <div class="service-name">

          </div>
        </article>

        <div class="connector"></div>

        <!-- 3. არქიტექტურული დაგეგმარება -->

        <article class="service">
          <div class="service-icon-wrapper">
            <div class="service-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20h16"></path>
                <path d="M6 20V8l6-4 6 4v12"></path>
                <path d="M9 20v-6h6v6"></path>

            <span class="service-number">3</span>

          <div class="service-name">
            არქიტექტურული<br>
            დაგეგმარება
          </div>
        </article>

        <div class="connector"></div>

        <!-- 4. ესკიზის პროექტირება -->

        <article class="service">
          <div class="service-icon-wrapper">
            <div class="service-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20z"></path>
                <path d="M13.5 7.5l3 3"></path>

              </svg>

            <span class="service-number">4</span>
          </div>

          <div class="service-name">
            ესკიზის<br>
            პროექტირება
          </div>
        </article>

        <div class="connector"></div>

        <!-- 5. დამატებითი არქიტექტურული მომსახურება -->

        <article class="service">
          <div class="service-icon-wrapper">
            <div class="service-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20h16"></path>
                <path d="M5 20V9l7-5 7 5v11"></path>
                <path d="M8 20v-6h8v6"></path>

                <path d="M12 7v4"></path>
              </svg>
            </div>

            <span class="service-number">5</span>
          </div>

          <div class="service-name">
            არქიტექტურული<br>
            დაგეგმარება
          </div>
        </article>

      </div>
    </div>

  </section>

</body>
</html>
